# 插件清单。Halo 2.x 靠 jar 根目录的这份文件识别插件（不需要 PF4J 的 plugin.properties）。
# 参考 https://docs.halo.run/developer-guide/plugin/basics/manifest
apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # 这个名字决定插件资源路由：/plugins/whale-pet-live2d/**
  name: whale-pet-live2d
  # 上架应用市场后，把应用管理页里看到的 app-id 填进来（形如 app-xxxxxxxx）：
  # 这样手动装 jar 的那份也保留市场身份，能收到市场里的更新提示。
  # annotations:
  #   "store.halo.run/app-id": "app-xxxxxxxx"
spec:
  enabled: true
  # 2.21 起 Halo 要求 Java 21，所以基线不低于 2.21.0。
  # 已实测：2.21.0 与 2.26.0 上均 22/22 通过（tools/halo-smoke.mjs）。
  requires: ">=2.21.0"
  # 注意：下面的 version 会被 devtools 插件按 gradle.properties 的 version 覆盖写入，
  # 改版本请改 gradle.properties，不要只改这里。
  version: 0.1.0
  # 必须与 extensions/settings.yaml 里 Setting 的 metadata.name 完全一致，
  # 否则插件启动时会因为找不到 settingName 对应的 Setting 而失败
  settingName: whale-pet-live2d-settings
  configMapName: whale-pet-live2d-configmap
  displayName: "鲸鱼娘桌宠（Live2D）"
  # 审核要求：logo 不能用插件模板的默认图标。它由 ReverseProxy 的 /logo/** 固定路径发出。
  logo: "/plugins/whale-pet-live2d/assets/logo/logo.png"
  repo: "https://github.com/zqy857/dsh-pet-live2d"
  homepage: "https://github.com/zqy857/dsh-pet-live2d"
  issues: "https://github.com/zqy857/dsh-pet-live2d/issues"
  description: >-
    在 Halo 站点上挂一只 Live2D 桌宠（DS鲸鱼娘）：可拖动、跟随鼠标、右键面板换装，
    评论/搜索等页面事件会让她换动作与表情。桌宠客户端与渲染栈移植自
    A8Chann/dsh-pet-live2d（MIT）；角色形象是社区基于 DeepSeek 元素的同人二创，
    与 DeepSeek 官方无任何关系。资源随插件分发，通过
    /plugins/whale-pet-live2d/assets/v<版本>/** 暴露（升级即换 URL，绕过静态资源一年缓存）。
    代码 MIT；模型与贴图是 CC BY-NC-SA 4.0（署名 · 非商业 · 相同方式共享，
    版权：上善无形 / ZipZipPipe / 氵六青）；Live2D Cubism Core 为 Live2D 专有运行时，
    本插件不分发，默认从 Live2D 官方 CDN 取（可在插件设置里改成自建地址）。
    不收集、不上传任何访客数据。
  author:
    # 上游 DSH 插件作者 + Halo 移植/维护者，两个都写清楚
    name: "A8Chann & zqy857"
    website: "https://github.com/zqy857/dsh-pet-live2d"
  license:
    # 代码 MIT；美术资源是 CC BY-NC-SA 4.0（非商业）。两者分开列，别混成一条。
    - name: "MIT"
      url: "https://github.com/zqy857/dsh-pet-live2d/blob/main/LICENSE"
    - name: "CC BY-NC-SA 4.0"
      url: "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh"
